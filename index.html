<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make iOS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body {
            background: #000;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер телефона (эмуляция экрана) */
        .iphone-screen {
            width: 100%;
            height: 100%;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1964&auto=format&fit=crop') no-repeat center center;
            background-size: cover;
            position: relative;
            transition: filter 1s ease-in-out;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            color: white;
        }

        /* Эффект затемнения */
        .iphone-screen.dimmed {
            filter: brightness(0.3);
        }

        /* Экран блокировки */
        .lock-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            display: none; /* Скрыт по умолчанию */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: white;
        }

        .lock-screen.active {
            display: flex;
        }

        .time {
            font-size: 80px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .date {
            font-size: 20px;
            margin-bottom: 50px;
        }

        .swipe-up {
            font-size: 16px;
            opacity: 0.7;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Панель приложений (внизу) */
        .dock {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 30px;
            margin-bottom: 20px;
        }

        .app-icon {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #0078D7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Экран iPhone -->
    <div class="iphone-screen" id="screen" onclick="resetTimer()">
        
        <!-- Экран блокировки -->
        <div class="lock-screen" id="lockScreen" onclick="unlock()">
            <div class="time" id="clock">12:00</div>
            <div class="date" id="date">Понедельник, 16 ноября</div>
            <div class="swipe-up">Смахните вверх, чтобы разблокировать</div>
        </div>

        <!-- Виджеты на рабочем столе -->
        <div style="text-align: center; margin-top: 50px;">
            <h1 style="font-size: 24px; text-shadow: 1px 1px 5px black;">Make iOS</h1>
            <p style="font-size: 14px; opacity: 0.8;">Симулятор системы</p>
        </div>

        <!-- Док-панель -->
        <div class="dock">
            <div class="app-icon" style="background: #007AFF;">📞</div>
            <div class="app-icon" style="background: #34C759;">💬</div>
            <div class="app-icon" style="background: #FF9500;">📸</div>
            <div class="app-icon" style="background: #FF2D55;">🎵</div>
        </div>

    </div>

    <script>
        const screen = document.getElementById('screen');
        const lockScreen = document.getElementById('lockScreen');
        const clock = document.getElementById('clock');
        const dateEl = document.getElementById('date');

        let inactivityTimer;
        const INACTIVITY_TIME = 60000; // 60 000 мс = 1 минута

        // Функция для обновления времени
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            clock.innerText = hours + ':' + minutes;

            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            dateEl.innerText = now.toLocaleDateString('ru-RU', options);
        }

        // Функция для блокировки экрана
        function lockDevice() {
            screen.classList.add('dimmed'); // Затемняем
            setTimeout(() => {
                lockScreen.classList.add('active'); // Показываем экран блокировки
            }, 1000); // Через секунду после затемнения
        }

        // Функция для разблокировки
        function unlock() {
            lockScreen.classList.remove('active');
            screen.classList.remove('dimmed');
            resetTimer(); // Сбрасываем таймер бездействия
        }

        // Сброс таймера при касании экрана
        function resetTimer() {
            clearTimeout(inactivityTimer);
            // Если экран заблокирован, не запускаем таймер сразу
            if (!lockScreen.classList.contains('active')) {
                inactivityTimer = setTimeout(lockDevice, INACTIVITY_TIME);
            }
        }

        // Запускаем таймер при загрузке
        resetTimer();
        updateClock();
        setInterval(updateClock, 1000); // Обновляем время каждую секунду

        // Слушаем касания/клики, чтобы сбрасывать таймер
        document.addEventListener('touchstart', resetTimer);
        document.addEventListener('mousedown', resetTimer);

    </script>
</body>
</html>
