<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космос 4</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:#0a0e27; color:#e0e0ff;
         font-family:system-ui,sans-serif; display:flex;
         align-items:center; justify-content:center; padding:20px; }
  .card { background:#141a3d; border:1px solid #2a3366;
          border-radius:16px; padding:36px; text-align:center;
          max-width:440px; width:100%; }
  h1 { margin:0 0 8px; font-size:26px; }
  p  { color:#8890b5; margin:0 0 24px; }
  input { width:100%; padding:12px 16px; font-size:18px;
          border-radius:8px; border:1px solid #2a3366;
          background:#0a0e27; color:#fff; text-align:center;
          letter-spacing:4px; text-transform:uppercase;
          margin-bottom:12px; }
  button { width:100%; padding:12px; font-size:16px; border-radius:8px;
           border:none; background:#4a5cff; color:#fff; cursor:pointer; }
  button:hover { background:#5c6cff; }
  .msg { min-height:20px; margin-top:10px; color:#ff6b6b; }
  img.qr { width:220px; height:220px; background:#fff;
           padding:12px; border-radius:12px; margin:16px auto;
           display:block; }
  .hint { margin-top:16px; color:#7cf; }
  .back { display:inline-block; margin-top:20px; color:#8890b5;
          cursor:pointer; text-decoration:underline; }
  .page { display:none; }
  .page.active { display:block; }
</style>
</head>
<body>

<!-- ГЛАВНАЯ -->
<div id="page-login" class="page active">
  <div class="card">
    <h1>🚀 Космос 4</h1>
    <p>Введите код доступа</p>
    <input id="codeInput" maxlength="12" placeholder="КОД" autocomplete="off">
    <button onclick="checkCode()">Войти</button>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<!-- СТРАНИЦА С QR -->
<div id="page-qr" class="page">
  <div class="card">
    <h1>📷 Шаг 1</h1>
    <p>Отсканируй QR-код</p>
    <img class="qr"
         src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=Привет!+Жди+следующего+шага+🚀"
         alt="QR-код">
    <div class="hint">Потихоньку отсканируй и жди следующего 🚀</div>
    <span class="back" onclick="showPage('page-login')">← Назад</span>
  </div>
</div>

<script>
/* ===== КОДЫ ===== */
const CODES = {
  "КОСМОС4": "page-qr"     // ← код ведёт на страницу с QR
};

function showPage(id) {
  document.querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  location.hash = (id === 'page-login') ? '' : id;
  window.scrollTo(0,0);
}

function checkCode() {
  const code = document.getElementById('codeInput').value
                 .trim().toUpperCase();
  const msg  = document.getElementById('loginMsg');
  if (!code) { msg.textContent = 'Введите код'; return; }

  if (CODES[code]) {
    msg.textContent = '';
    showPage(CODES[code]);
  } else {
    msg.textContent = '❌ Код не найден';
  }
}

document.getElementById('codeInput')
  .addEventListener('keydown', e => {
    if (e.key === 'Enter') checkCode();
  });

/* если в URL есть #page-qr — открыть сразу */
const hash = location.hash.replace('#','');
if (hash && document.getElementById(hash)) showPage(hash);
</script>
</body>
</html>
