<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космос 4 · Математика</title>
<style>
  :root {
    --bg-deep:#03060f; --bg-mid:#0a1228;
    --card-bg:rgba(15,25,50,.65);
    --card-border:rgba(100,180,255,.15);
    --text:#eaf0ff; --muted:#6b7a9e;
    --cyan:#38e0ff; --blue:#4f7fff; --gold:#ffcc4d; --pink:#ff5c9e;
    --ok:#3ddc84; --bad:#ff5c5c;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(79,127,255,.25) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(56,224,255,.2) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, var(--bg-mid) 0%, var(--bg-deep) 75%);
    color:var(--text);
    font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px; position:relative; overflow-x:hidden;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1px 1px at 8% 12%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 22% 8%, #cfe8ff, transparent),
      radial-gradient(1px 1px at 38% 22%, #fff, transparent),
      radial-gradient(2px 2px at 55% 6%, #fff, transparent),
      radial-gradient(1px 1px at 72% 18%, #a8d0ff, transparent),
      radial-gradient(1.5px 1.5px at 88% 10%, #fff, transparent),
      radial-gradient(1px 1px at 12% 45%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 30% 58%, #cfe8ff, transparent),
      radial-gradient(1px 1px at 48% 75%, #fff, transparent),
      radial-gradient(2px 2px at 68% 62%, #fff, transparent),
      radial-gradient(1px 1px at 82% 82%, #a8d0ff, transparent),
      radial-gradient(1.5px 1.5px at 95% 40%, #fff, transparent),
      radial-gradient(1px 1px at 5% 88%, #fff, transparent);
    animation:twinkle 6s ease-in-out infinite alternate;
    opacity:.65;
  }
  @keyframes twinkle { 0%,100%{opacity:.4} 50%{opacity:.8} }
  .wrap { width:100%; max-width:680px; position:relative; z-index:1; }
  .card {
    background:var(--card-bg);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--card-border);
    border-radius:28px; padding:38px 32px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.7),
      0 0 80px rgba(79,127,255,.08),
      inset 0 1px 0 rgba(255,255,255,.06);
    animation:cardIn .6s cubic-bezier(.2,.8,.2,1);
    position:relative; overflow:hidden;
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.5;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(30px) scale(.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  .emblem {
    width:72px; height:72px; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,
               rgba(56,224,255,.3), rgba(79,127,255,.15));
    border:1.5px solid rgba(56,224,255,.3);
    box-shadow:0 0 30px rgba(56,224,255,.4),
               inset 0 0 20px rgba(79,127,255,.2);
    animation:emblemPulse 3s ease-in-out infinite;
    font-size:32px;
  }
  @keyframes emblemPulse {
    0%,100% { box-shadow:0 0 30px rgba(56,224,255,.35),
                          inset 0 0 20px rgba(79,127,255,.15); }
    50%     { box-shadow:0 0 50px rgba(56,224,255,.6),
                          inset 0 0 30px rgba(79,127,255,.3); }
  }
  h1 {
    font-size:28px; font-weight:800; letter-spacing:5px;
    text-align:center; margin-bottom:8px;
    background:linear-gradient(135deg, var(--cyan), var(--blue), var(--gold));
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 5s linear infinite;
  }
  @keyframes shine { to { background-position:200% center; } }
  .sub {
    color:var(--muted); font-size:12px; letter-spacing:3px;
    text-transform:uppercase; text-align:center;
    margin-bottom:28px; font-weight:500;
  }
  input, textarea {
    width:100%; padding:15px 18px; font-size:16px;
    border-radius:16px;
    border:1.5px solid rgba(100,180,255,.15);
    background:rgba(3,6,15,.7);
    color:var(--text); margin-bottom:14px;
    transition:.3s; font-family:inherit;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
  }
  input:focus, textarea:focus {
    outline:none; border-color:var(--cyan);
    background:rgba(3,6,15,.9);
    box-shadow:0 0 0 4px rgba(56,224,255,.1),
               0 0 30px rgba(56,224,255,.2);
  }
  input::placeholder, textarea::placeholder { color:#4a5878; }
  textarea { font-family:monospace; font-size:14px;
             resize:vertical; min-height:100px; }
  button {
    width:100%; padding:15px; font-size:15px; font-weight:700;
    border-radius:16px; border:none; cursor:pointer;
    letter-spacing:1px; margin-bottom:10px;
    transition:.3s; font-family:inherit;
    position:relative; overflow:hidden;
  }
  button.main {
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    color:#03060f; font-weight:800;
    box-shadow:0 8px 30px rgba(79,127,255,.4),
               inset 0 1px 0 rgba(255,255,255,.3);
  }
  button.main:hover {
    transform:translateY(-2px);
    box-shadow:0 12px 40px rgba(79,127,255,.6),
               0 0 60px rgba(56,224,255,.4);
  }
  button.admin-btn {
    background:linear-gradient(135deg, rgba(255,204,77,.15), rgba(255,92,158,.15));
    border:1.5px solid rgba(255,204,77,.4);
    color:var(--gold);
    box-shadow:0 0 24px rgba(255,204,77,.2);
  }
  button.admin-btn:hover {
    background:linear-gradient(135deg, rgba(255,204,77,.25), rgba(255,92,158,.25));
    border-color:var(--gold); color:#fff;
    box-shadow:0 0 40px rgba(255,204,77,.4);
    transform:translateY(-1px);
  }
  button.sec {
    background:transparent; color:var(--text);
    border:1.5px solid rgba(100,180,255,.2);
  }
  button.sec:hover {
    border-color:var(--cyan);
    background:rgba(56,224,255,.06);
    color:var(--cyan);
  }
  button:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }
  .msg { min-height:22px; margin-top:12px; text-align:center;
         font-size:14px; color:var(--bad); font-weight:500; }
  .hidden { display:none !important; }

  /* выбор класса */
  .grade-grid { display:grid; grid-template-columns:repeat(4,1fr);
                gap:10px; margin-bottom:20px; }
  .grade-btn {
    padding:16px 10px; border-radius:14px;
    border:1.5px solid rgba(100,180,255,.2);
    background:rgba(10,18,40,.6);
    color:var(--text); font-size:18px; font-weight:800;
    cursor:pointer; transition:.25s;
    text-align:center;
  }
  .grade-btn:hover {
    border-color:var(--cyan);
    background:rgba(56,224,255,.1);
    transform:translateY(-2px);
  }
  .grade-btn.selected {
    border-color:var(--cyan);
    background:linear-gradient(135deg, rgba(79,127,255,.3), rgba(56,224,255,.3));
    box-shadow:0 0 30px rgba(56,224,255,.4);
    transform:scale(1.05);
  }
  .grade-label { text-align:center; color:var(--muted);
                 font-size:12px; text-transform:uppercase;
                 letter-spacing:2px; margin-bottom:12px; }

  .q-img { width:100%; max-height:300px; object-fit:cover;
           border-radius:20px; margin-bottom:22px;
           border:1px solid rgba(100,180,255,.2);
           box-shadow:0 15px 40px rgba(0,0,0,.6);
           animation:imgIn .5s ease-out; }
  @keyframes imgIn {
    from { opacity:0; transform:scale(.95); }
    to   { opacity:1; transform:scale(1); }
  }
  .q-text { font-size:22px; font-weight:700; text-align:center;
            margin-bottom:24px; line-height:1.4; color:#fff; }
  .options { display:grid; gap:12px; }
  .opt {
    padding:16px 20px; border-radius:16px;
    border:1.5px solid rgba(100,180,255,.15);
    background:rgba(10,18,40,.6);
    color:var(--text); font-size:15px; text-align:left;
    display:flex; align-items:center; gap:16px;
    cursor:pointer; transition:.25s; width:100%;
    font-weight:500;
  }
  .opt:hover {
    border-color:var(--cyan);
    background:rgba(56,224,255,.08);
    transform:translateX(4px);
  }
  .opt .letter {
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; flex-shrink:0;
    color:#03060f;
  }
  .opt.correct { border-color:var(--ok); background:rgba(61,220,132,.12); }
  .opt.correct .letter { background:linear-gradient(135deg,#1a8a4a,var(--ok)); }
  .opt.wrong   { border-color:var(--bad); background:rgba(255,92,92,.12); }
  .opt.wrong .letter { background:linear-gradient(135deg,#a03030,var(--bad)); }

  .progress { display:flex; justify-content:center; gap:8px;
              margin-bottom:26px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%;
         background:rgba(100,180,255,.15); transition:.4s; }
  .dot.active { background:var(--cyan);
                box-shadow:0 0 20px var(--cyan); transform:scale(1.4); }
  .dot.done { background:var(--blue); }

  .score { font-size:72px; font-weight:900; text-align:center;
           margin:20px 0;
           background:linear-gradient(135deg, var(--cyan), var(--gold), var(--pink));
           background-size:200% auto;
           -webkit-background-clip:text; background-clip:text;
           -webkit-text-fill-color:transparent;
           animation:shine 4s linear infinite; }
  .score small { font-size:26px; color:var(--muted);
                 -webkit-text-fill-color:var(--muted); }

  .report-code {
    font-family:'Courier New',monospace;
    font-size:14px; font-weight:700;
    text-align:center; letter-spacing:1px; padding:18px;
    background:rgba(3,6,15,.8);
    border:2px dashed rgba(100,180,255,.3);
    border-radius:16px;
    margin:18px 0; word-break:break-all; cursor:pointer;
    transition:.3s; color:var(--cyan);
  }
  .report-code:hover {
    border-color:var(--cyan); border-style:solid;
    box-shadow:0 0 30px rgba(56,224,255,.3);
  }
  .report-hint { text-align:center; color:var(--muted);
                 font-size:13px; margin-top:6px; }

  .results-table {
    width:100%; border-collapse:separate;
    border-spacing:0; margin-top:20px;
    border-radius:16px; overflow:hidden;
    background:rgba(3,6,15,.4);
    border:1px solid rgba(100,180,255,.1);
  }
  .results-table th {
    font-size:11px; text-transform:uppercase; color:var(--muted);
    text-align:left; padding:14px 12px;
    background:rgba(79,127,255,.08);
    border-bottom:1px solid rgba(100,180,255,.15);
  }
  .results-table td {
    padding:14px 12px;
    border-bottom:1px solid rgba(100,180,255,.06);
    font-size:14px;
  }
  .results-table tr:last-child td { border-bottom:none; }
  .empty { text-align:center; color:var(--muted);
           padding:40px 0; font-size:14px; }
  .top1 { color:var(--gold); font-weight:800; }

  .fact {
    margin-top:18px; padding:16px 20px;
    background:rgba(56,224,255,.06);
    border:1px solid rgba(56,224,255,.25);
    border-radius:14px;
    font-size:14px; line-height:1.6;
    animation:factIn .4s ease-out;
  }
  @keyframes factIn {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }

  /* детальный отчёт */
  .detail-card {
    margin-top:16px; padding:16px;
    background:rgba(3,6,15,.5);
    border:1px solid rgba(100,180,255,.15);
    border-radius:14px;
  }
  .detail-header {
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:12px;
  }
  .detail-name { font-weight:800; font-size:16px; color:var(--cyan); }
  .detail-score { font-weight:800; color:var(--gold); }
  .detail-q {
    padding:8px 0; border-bottom:1px solid rgba(100,180,255,.08);
    font-size:13px; line-height:1.5;
  }
  .detail-q:last-child { border-bottom:none; }
  .detail-q .q-title { color:#c8d0ff; margin-bottom:4px; }
  .detail-q .q-answer { color:var(--muted); }
  .detail-q .q-answer.ok { color:var(--ok); }
  .detail-q .q-answer.bad { color:var(--bad); }
</style>
</head>
<body>
<div class="wrap">

  <!-- ВХОД -->
  <div id="screen-login" class="card">
    <div class="emblem">🧮</div>
    <h1>КОСМОС 4</h1>
    <p class="sub">Математика · ОГЭ/ЕГЭ стиль</p>

    <p class="grade-label">Выбери свой класс</p>
    <div class="grade-grid" id="gradeGrid">
      <button class="grade-btn" data-grade="1" onclick="selectGrade(1)">1</button>
      <button class="grade-btn" data-grade="2" onclick="selectGrade(2)">2</button>
      <button class="grade-btn" data-grade="3" onclick="selectGrade(3)">3</button>
      <button class="grade-btn" data-grade="4" onclick="selectGrade(4)">4</button>
    </div>

    <input id="nameInput" placeholder="Твоё имя" maxlength="20">
    <button class="main" onclick="startQuiz()">🎮 Начать викторину</button>
    <button class="admin-btn" onclick="showAdminLogin()">
      👑 Я ВОЖАТЫЙ — проверить
    </button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- ВХОД ВОЖАТОГО -->
  <div id="screen-admin-login" class="card hidden">
    <div class="emblem">🔐</div>
    <h1>ВОЖАТЫЙ</h1>
    <p class="sub">Пароль доступа</p>
    <input id="adminPass" type="password" placeholder="Пароль">
    <button class="main" onclick="checkAdminPass()">Войти</button>
    <button class="sec" onclick="showScreen('screen-login')">← Назад</button>
    <div id="adminMsg" class="msg"></div>
  </div>

  <!-- ВОПРОС -->
  <div id="screen-question" class="card hidden">
    <div class="progress" id="progress"></div>
    <img id="qImg" class="q-img" alt="" style="display:none;">
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
    <div id="answerMsg" class="msg"></div>
    <div id="factBox"></div>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="screen-result" class="card hidden">
    <div class="emblem">🏆</div>
    <h1>РЕЗУЛЬТАТ</h1>
    <div id="resultText" style="text-align:center; font-size:16px;
         color:var(--muted); margin-top:8px;"></div>
    <div class="score" id="resultScore"></div>
    <p class="report-hint" style="margin-top:20px;">
      Покажи этот код вожатому:
    </p>
    <div class="report-code" id="reportCode" onclick="copyCode()"></div>
    <p class="report-hint" style="margin-bottom:18px;">
      (нажми на код, чтобы скопировать)
    </p>
    <button class="sec" onclick="backToLogin()">← К списку</button>
  </div>

  <!-- ПРОВЕРКА ВОЖАТЫМ -->
  <div id="screen-check" class="card hidden">
    <div class="emblem">📊</div>
    <h1>РЕЗУЛЬТАТЫ</h1>
    <p class="sub">Вставь коды от участников</p>
    <textarea id="codesInput"
      placeholder="Вставляй коды с новой строки — каждый на отдельной строке"></textarea>
    <button class="main" onclick="checkCodes()">📊 Проверить</button>
    <button class="sec" onclick="clearResults()">🗑 Очистить</button>
    <button class="sec" onclick="showScreen('screen-login')">← Назад</button>
    <div id="checkResults"></div>
  </div>

</div>

<script>
const ADMIN_PASSWORD = "vodadmin";

/* ===== ВОПРОСЫ ПО КЛАССАМ ===== */
const QUESTIONS = {
  1: [
    { q:"Сколько будет 3 + 4?", options:["5","6","7","8"], correct:2,
      fact:"3 + 4 = 7", img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800" },
    { q:"Сколько будет 10 − 6?", options:["3","4","5","6"], correct:1,
      fact:"10 − 6 = 4", img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800" },
    { q:"Сколько сторон у квадрата?", options:["3","4","5","6"], correct:1,
      fact:"У квадрата 4 стороны", img:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800" },
    { q:"Какое число больше: 8 или 5?", options:["8","5","равны","не знаю"], correct:0,
      fact:"8 больше 5", img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800" },
    { q:"Сколько будет 2 + 2 + 2?", options:["4","5","6","7"], correct:2,
      fact:"2+2+2 = 6", img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800" }
  ],
  2: [
    { q:"Сколько будет 7 + 5?", options:["10","11","12","13"], correct:2,
      fact:"7 + 5 = 12. Сначала до 10 (+3), потом ещё +2", img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800" },
    { q:"Сколько будет 15 − 8?", options:["6","7","8","9"], correct:1,
      fact:"15 − 8 = 7", img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800" },
    { q:"Сколько будет 4 × 3?", options:["7","10","12","14"], correct:2,
      fact:"4 × 3 = 12. Это 4+4+4", img:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800" },
    { q:"У Пети 10 яблок. Он отдал 3. Сколько осталось?", options:["6","7","8","9"], correct:1,
      fact:"10 − 3 = 7", img:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=800" },
    { q:"Сколько углов у квадрата?", options:["3","4","5","6"], correct:1,
      fact:"У квадрата 4 угла", img:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800" }
  ],
  3: [
    { q:"Сколько будет 25 + 17?", options:["32","40","42","44"], correct:2,
      fact:"25 + 17 = 42. 25+15=40, +2=42", img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800" },
    { q:"Сколько будет 8 × 7?", options:["48","54","56","64"], correct:2,
      fact:"8 × 7 = 56. Это 8×5 + 8×2 = 40+16", img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800" },
    { q:"Сколько будет 100 − 37?", options:["53","63","67","73"], correct:1,
      fact:"100 − 37 = 63", img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800" },
    { q:"Периметр квадрата со стороной 5 см?", options:["10","15","20","25"], correct:2,
      fact:"P = 4 × 5 = 20 см", img:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800" },
    { q:"Сколько минут в 2 часах?", options:["60","90","120","150"], correct:2,
      fact:"1 час = 60 минут, 2 часа = 120 минут", img:"https://images.unsplash.com/photo-1501139083538-0139583c060f?w=800" }
  ],
  4: [
    { q:"Сколько будет 144 ÷ 12?", options:["10","11","12","13"], correct:2,
      fact:"144 ÷ 12 = 12. Проверка: 12 × 12 = 144", img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800" },
    { q:"Сколько будет 25 × 4?", options:["75","90","100","125"], correct:2,
      fact:"25 × 4 = 100. Это 100", img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800" },
    { q:"Площадь прямоугольника 6 × 8?", options:["14","28","42","48"], correct:3,
      fact:"S = 6 × 8 = 48", img:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800" },
    { q:"Сколько будет 1000 − 250?", options:["650","700","750","800"], correct:2,
      fact:"1000 − 250 = 750", img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800" },
    { q:"Сколько секунд в 3 минутах?", options:["120","150","180","210"], correct:2,
      fact:"1 мин = 60 сек, 3 мин = 180 сек", img:"https://images.unsplash.com/photo-1501139083538-0139583c060f?w=800" }
  ]
};

let playerName = "";
let playerGrade = 0;
let mySlides = [];
let idx = 0;
let score = 0;
let answered = false;
let myAnswers = [];   // ответы: [{q, chosen, correct, isRight}]

function showScreen(id) {
  document.querySelectorAll('.wrap > div')
    .forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function selectGrade(g) {
  playerGrade = g;
  document.querySelectorAll('.grade-btn').forEach(b => {
    b.classList.toggle('selected', +b.dataset.grade === g);
  });
}

function startQuiz() {
  const name = document.getElementById('nameInput').value.trim();
  if (!playerGrade) {
    document.getElementById('loginMsg').textContent = 'Выбери класс';
    return;
  }
  if (!name) {
    document.getElementById('loginMsg').textContent = 'Введи имя';
    return;
  }
  playerName = name;
  mySlides = shuffle(QUESTIONS[playerGrade]);
  idx = 0; score = 0; myAnswers = [];
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  if (idx >= mySlides.length) { finish(); return; }
  const s = mySlides[idx];
  answered = false;

  const img = document.getElementById('qImg');
  if (s.img) { img.src = s.img; img.style.display='block'; }
  else img.style.display='none';

  document.getElementById('qText').textContent = s.q;
  document.getElementById('answerMsg').textContent = '';
  document.getElementById('factBox').innerHTML = '';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  s.options.forEach((text,i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[i]}</span><span>${text}</span>`;
    b.onclick = () => chooseAnswer(i, b);
    opts.appendChild(b);
  });

  const pr = document.getElementById('progress'); pr.innerHTML='';
  mySlides.forEach((_,i)=>{
    const d=document.createElement('div'); d.className='dot';
    if (i===idx) d.classList.add('active');
    else if (i<idx) d.classList.add('done');
    pr.appendChild(d);
  });
}

function chooseAnswer(choice, btn) {
  if (answered) return;
  answered = true;

  const s = mySlides[idx];
  const correct = choice === s.correct;
  document.querySelectorAll('#options .opt').forEach(b=>b.disabled=true);

  myAnswers.push({
    q: s.q,
    chosenText: s.options[choice],
    correctText: s.options[s.correct],
    isRight: correct
  });

  if (correct) {
    score++;
    btn.classList.add('correct');
    document.getElementById('answerMsg').textContent = '✅ Правильно!';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('#options .opt')[s.correct]
      .classList.add('correct');
    document.getElementById('answerMsg').textContent = '❌ Неправильно';
  }

  if (s.fact) {
    document.getElementById('factBox').innerHTML =
      `<div class="fact">💡 ${s.fact}</div>`;
  }

  setTimeout(()=>{ idx++; renderQuestion(); }, 2200);
}

/* Код-отчёт: имя|класс|счёт|base64(ответы) */
function makeCode() {
  const payload = JSON.stringify(myAnswers);
  // компактное base64 (UTF-8)
  const b64 = btoa(unescape(encodeURIComponent(payload)));
  return `${playerName}|${playerGrade}|${score}/${mySlides.length}|${b64}`;
}

function finish() {
  showScreen('screen-result');
  document.getElementById('resultText').textContent =
    `${playerName} (${playerGrade} класс), твой результат:`;
  document.getElementById('resultScore').innerHTML =
    `${score}<small> / ${mySlides.length}</small>`;
  const code = makeCode();
  document.getElementById('reportCode').textContent = code;
  document.getElementById('reportCode').dataset.code = code;
}

function copyCode() {
  const el = document.getElementById('reportCode');
  const code = el.dataset.code;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    const old = el.textContent;
    el.textContent = '✅ Скопировано!';
    setTimeout(()=>{ el.textContent = old; }, 1200);
  });
}

function backToLogin() {
  document.getElementById('nameInput').value = playerName;
  showScreen('screen-login');
}

function showAdminLogin() {
  showScreen('screen-admin-login');
  document.getElementById('adminMsg').textContent = '';
  document.getElementById('adminPass').value = '';
}

function checkAdminPass() {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    showScreen('screen-check');
  } else {
    document.getElementById('adminMsg').textContent = '❌ Неверный пароль';
  }
}

/* ===== РАЗБОР КОДОВ ===== */
function checkCodes() {
  const raw = document.getElementById('codesInput').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [];

  lines.forEach(line => {
    const parts = line.split('|');
    if (parts.length < 4) return;
    const name = parts[0].trim();
    const grade = parts[1].trim();
    const scoreStr = parts[2].trim();
    const b64 = parts[3].trim();
    const m = scoreStr.match(/^(\d+)\s*\/\s*(\d+)$/);
    if (!m) return;

    let answers = [];
    try {
      answers = JSON.parse(decodeURIComponent(escape(atob(b64))));
    } catch(e) { return; }

    rows.push({
      name, grade,
      sc: parseInt(m[1],10),
      total: parseInt(m[2],10),
      answers
    });
  });
