<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космос 4 · Викторина</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh;
    background:radial-gradient(circle at 50% -10%, #1c1c1c 0%, #000 55%);
    color:#f5f5f5; font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .wrap { width:100%; max-width:640px; }
  .card {
    background:linear-gradient(180deg,#121212,#0a0a0a);
    border:1px solid #222; border-radius:24px; padding:34px 28px;
    box-shadow:0 30px 80px rgba(0,0,0,.8);
    animation:fadeUp .5s ease-out;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  h1 { font-size:24px; font-weight:800; letter-spacing:3px;
       text-align:center; margin-bottom:6px; }
  .sub { color:#8a8a8a; font-size:12px; letter-spacing:2px;
         text-transform:uppercase; text-align:center; margin-bottom:24px; }
  input {
    width:100%; padding:14px 16px; font-size:16px; border-radius:12px;
    border:1.5px solid #2c2c2c; background:#050505; color:#fff;
    margin-bottom:12px;
  }
  input:focus { outline:none; border-color:#fff;
                box-shadow:0 0 0 3px rgba(255,255,255,.08); }
  button {
    width:100%; padding:14px; font-size:15px; font-weight:700;
    border-radius:12px; border:1px solid #fff; cursor:pointer;
    background:#fff; color:#000; letter-spacing:1px;
    transition:.2s; margin-bottom:8px;
  }
  button:hover { background:#000; color:#fff;
                 box-shadow:0 0 24px rgba(255,255,255,.3); }
  button.sec { background:transparent; color:#fff; border-color:#333; }
  button.sec:hover { background:#fff; color:#000; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  .msg { min-height:20px; margin-top:10px; text-align:center; font-size:14px; }
  .hidden { display:none !important; }
  .q-img { width:100%; max-height:260px; object-fit:cover;
           border-radius:14px; margin-bottom:18px; border:1px solid #222; }
  .q-text { font-size:20px; font-weight:700; text-align:center;
            margin-bottom:20px; line-height:1.4; }
  .options { display:grid; gap:10px; }
  .opt {
    padding:14px 18px; border-radius:12px; border:1.5px solid #2c2c2c;
    background:#080808; color:#fff; font-size:15px; text-align:left;
    display:flex; align-items:center; gap:12px;
    cursor:pointer; transition:.2s; width:100%;
  }
  .opt:hover { border-color:#fff; background:#141414; }
  .opt .letter { width:26px; height:26px; border-radius:50%;
                 background:#222; display:flex; align-items:center;
                 justify-content:center; font-weight:700; font-size:13px; }
  .opt.correct { border-color:#4ade80; background:#0a2a15; }
  .opt.wrong   { border-color:#f87171; background:#2a0a0a; }
  .progress { display:flex; justify-content:center; gap:6px; margin-bottom:20px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#222; }
  .dot.active { background:#fff; box-shadow:0 0 12px #fff; }
  .dot.done   { background:#555; }
  .score { font-size:56px; font-weight:800; text-align:center; margin:16px 0;
           letter-spacing:2px; }
  .score small { font-size:22px; color:#8a8a8a; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ВХОД -->
  <div id="screen-login" class="card">
    <h1>КОСМОС 4</h1>
    <p class="sub">Викторина · 5 вопросов</p>
    <input id="nameInput" placeholder="Твоё имя" maxlength="20">
    <button onclick="startQuiz()">Начать</button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- ВОПРОС -->
  <div id="screen-question" class="card hidden">
    <div class="progress" id="progress"></div>
    <img id="qImg" class="q-img" alt="" style="display:none;">
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
    <div id="answerMsg" class="msg"></div>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="screen-result" class="card hidden">
    <h1>РЕЗУЛЬТАТ</h1>
    <div id="resultText" style="text-align:center; font-size:16px;
         color:#8a8a8a; margin-top:8px;"></div>
    <div class="score" id="resultScore"></div>
    <button onclick="restart()">Пройти ещё раз</button>
  </div>

</div>

<script>
/* ===== ВОПРОСЫ (можешь менять) ===== */
const SLIDES = [
  { q:"Столица Франции?",
    img:"https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=800",
    options:["Париж","Лондон","Рим","Берлин"], correct:0 },
  { q:"Сколько планет в Солнечной системе?",
    img:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564?w=800",
    options:["7","8","9","10"], correct:1 },
  { q:"Кто написал «Войну и мир»?",
    img:"https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=800",
    options:["Пушкин","Достоевский","Толстой","Чехов"], correct:2 },
  { q:"Какой газ преобладает в атмосфере Земли?",
    img:"https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?w=800",
    options:["Кислород","Азот","Углекислый газ","Водород"], correct:1 },
  { q:"Самая большая планета?",
    img:"https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=800",
    options:["Сатурн","Нептун","Юпитер","Уран"], correct:2 }
];

let playerName = "";
let idx = 0;
let score = 0;

function showScreen(id) {
  document.querySelectorAll('.wrap > div')
    .forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startQuiz() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('loginMsg').textContent='Введи имя'; return; }
  playerName = name;
  idx = 0; score = 0;
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  if (idx >= SLIDES.length) { finish(); return; }
  const s = SLIDES[idx];

  const img = document.getElementById('qImg');
  if (s.img) { img.src = s.img; img.style.display='block'; }
  else img.style.display='none';

  document.getElementById('qText').textContent = s.q;
  document.getElementById('answerMsg').textContent = '';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  s.options.forEach((text,i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[i]}</span><span>${text}</span>`;
    b.onclick = () => chooseAnswer(i, b);
    opts.appendChild(b);
  });

  // прогресс
  const pr = document.getElementById('progress'); pr.innerHTML='';
  SLIDES.forEach((_,i)=>{
    const d=document.createElement('div'); d.className='dot';
    if (i===idx) d.classList.add('active');
    else if (i<idx) d.classList.add('done');
    pr.appendChild(d);
  });
}

function chooseAnswer(choice, btn) {
  const s = SLIDES[idx];
  const correct = choice === s.correct;

  // блокируем все
  document.querySelectorAll('#options .opt').forEach(b=>b.disabled=true);

  if (correct) {
    score++;
    btn.classList.add('correct');
    document.getElementById('answerMsg').textContent = '✅ Правильно!';
  } else {
    btn.classList.add('wrong');
    // подсветить правильный
    document.querySelectorAll('#options .opt')[s.correct]
      .classList.add('correct');
    document.getElementById('answerMsg').textContent = '❌ Неправильно';
  }

  setTimeout(()=>{ idx++; renderQuestion(); }, 1200);
}

function finish() {
  showScreen('screen-result');
  document.getElementById('resultText').textContent =
    `${playerName}, твой результат:`;
  document.getElementById('resultScore').innerHTML =
    `${score}<small> / ${SLIDES.length}</small>`;
}

function restart() {
  idx = 0; score = 0;
  document.getElementById('nameInput').value = playerName;
  showScreen('screen-login');
}
</script>
</body>
</html>
