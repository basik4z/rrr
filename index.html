<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космос 4 · Сказки</title>
<style>
  :root {
    --bg:#050510; --bg2:#0a0a1a;
    --card:#101020; --card2:#0a0a15;
    --line:#1f1f35;
    --text:#eef0ff; --muted:#6a6a8a;
    --accent:#a78bfa; --accent2:#f472b6;
    --ok:#4ade80; --bad:#f87171;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 0%, #1a1030 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, #2a1030 0%, transparent 50%),
      var(--bg);
    color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px; position:relative; overflow-x:hidden;
  }
  /* звёзды */
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, #fff 50%, transparent 50%),
      radial-gradient(1px 1px at 45% 15%, #cfe 50%, transparent 50%),
      radial-gradient(2px 2px at 75% 35%, #fff 50%, transparent 50%),
      radial-gradient(1px 1px at 25% 65%, #adf 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 60% 80%, #fff 50%, transparent 50%),
      radial-gradient(1px 1px at 90% 55%, #dff 50%, transparent 50%),
      radial-gradient(1.5px 1.5px at 35% 90%, #fff 50%, transparent 50%);
    opacity:.5;
    animation:twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from{opacity:.3} to{opacity:.7} }

  .wrap { width:100%; max-width:680px; position:relative; z-index:1; }

  .card {
    background:linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
    border:1px solid var(--line);
    border-radius:24px; padding:36px 30px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.9),
      0 0 60px rgba(167,139,250,.08),
      inset 0 1px 0 rgba(255,255,255,.03);
    animation:fadeUp .5s ease-out;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(24px); }
    to   { opacity:1; transform:translateY(0); }
  }

  h1 {
    font-size:26px; font-weight:800; letter-spacing:4px;
    text-align:center; margin-bottom:6px;
    background:linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
  }
  @keyframes shine { to { background-position:200% center; } }
  .sub {
    color:var(--muted); font-size:12px; letter-spacing:2px;
    text-transform:uppercase; text-align:center; margin-bottom:26px;
  }

  input, textarea {
    width:100%; padding:14px 16px; font-size:16px;
    border-radius:14px;
    border:1.5px solid var(--line);
    background:#05050f; color:var(--text);
    margin-bottom:12px;
    transition:.25s;
    font-family:inherit;
  }
  input:focus, textarea:focus {
    outline:none; border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(167,139,250,.15),
               0 0 24px rgba(167,139,250,.2);
  }
  input::placeholder, textarea::placeholder { color:#4a4a65; }
  textarea { font-family:monospace; font-size:14px;
             resize:vertical; min-height:90px; }

  button {
    width:100%; padding:14px; font-size:15px; font-weight:700;
    border-radius:14px; border:none; cursor:pointer;
    letter-spacing:1px; margin-bottom:10px;
    transition:.25s;
    position:relative; overflow:hidden;
  }
  /* основная кнопка */
  button.main {
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    background-size:200% auto;
    color:#fff;
    box-shadow:0 6px 24px rgba(167,139,250,.35);
  }
  button.main:hover {
    background-position:right center;
    box-shadow:0 10px 32px rgba(244,114,182,.45);
    transform:translateY(-2px);
  }
  button.main:active { transform:translateY(0); }

  /* кнопка вожатого */
  button.admin-btn {
    background:linear-gradient(90deg,#4a2a7a,#7a2a5a,#4a2a7a);
    background-size:200% auto;
    color:#fff; padding:16px;
    border:1px solid rgba(160,96,208,.5);
    box-shadow:0 0 24px rgba(160,96,208,.3),
               inset 0 0 20px rgba(160,96,208,.1);
  }
  button.admin-btn:hover {
    background-position:right center;
    box-shadow:0 0 36px rgba(160,96,208,.6);
    transform:translateY(-1px);
  }

  /* вторичная */
  button.sec {
    background:transparent; color:var(--text);
    border:1.5px solid var(--line);
  }
  button.sec:hover {
    border-color:var(--accent); background:rgba(167,139,250,.05);
    color:#fff;
  }

  button:disabled { opacity:.4; cursor:not-allowed; transform:none !important; }

  .msg { min-height:20px; margin-top:10px; text-align:center;
         font-size:14px; color:#ff8fa3; }
  .hidden { display:none !important; }

  /* картинка вопроса */
  .q-img {
    width:100%; max-height:280px; object-fit:cover;
    border-radius:16px; margin-bottom:20px;
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    animation:imgIn .4s ease-out;
  }
  @keyframes imgIn {
    from { opacity:0; transform:scale(.97); }
    to   { opacity:1; transform:scale(1); }
  }
  .q-text {
    font-size:21px; font-weight:700; text-align:center;
    margin-bottom:22px; line-height:1.4;
    color:#fff;
  }

  /* варианты */
  .options { display:grid; gap:10px; }
  .opt {
    padding:15px 18px; border-radius:14px;
    border:1.5px solid var(--line);
    background:rgba(10,10,21,.6);
    color:var(--text); font-size:15px; text-align:left;
    display:flex; align-items:center; gap:14px;
    cursor:pointer; transition:.2s; width:100%;
    font-weight:500;
  }
  .opt:hover {
    border-color:var(--accent);
    background:rgba(167,139,250,.08);
    transform:translateX(3px);
  }
  .opt .letter {
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:13px; flex-shrink:0;
    color:#fff;
    box-shadow:0 2px 8px rgba(167,139,250,.4);
  }
  .opt.correct {
    border-color:var(--ok);
    background:rgba(74,222,128,.1);
    box-shadow:0 0 20px rgba(74,222,128,.2);
  }
  .opt.wrong {
    border-color:var(--bad);
    background:rgba(248,113,113,.1);
    box-shadow:0 0 20px rgba(248,113,113,.2);
  }

  /* прогресс */
  .progress {
    display:flex; justify-content:center; gap:8px; margin-bottom:24px;
  }
  .dot {
    width:12px; height:12px; border-radius:50%;
    background:var(--line);
    transition:.3s;
  }
  .dot.active {
    background:var(--accent);
    box-shadow:0 0 16px var(--accent);
    transform:scale(1.2);
  }
  .dot.done {
    background:var(--accent2);
    box-shadow:0 0 8px rgba(244,114,182,.4);
  }

  /* результат */
  .score {
    font-size:64px; font-weight:800; text-align:center;
    margin:16px 0; letter-spacing:2px;
    background:linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .score small { font-size:24px; color:var(--muted);
                 -webkit-text-fill-color:var(--muted); }

  /* код-отчёт */
  .report-code {
    font-family:monospace; font-size:22px; font-weight:700;
    text-align:center; letter-spacing:3px; padding:18px;
    background:rgba(5,5,15,.8);
    border:2px dashed var(--line); border-radius:14px;
    margin:16px 0; word-break:break-all; cursor:pointer;
    transition:.25s; color:#fff;
  }
  .report-code:hover {
    border-color:var(--accent);
    box-shadow:0 0 20px rgba(167,139,250,.3);
  }
  .report-hint {
    text-align:center; color:var(--muted); font-size:13px;
  }

  /* таблица */
  .results-table {
    width:100%; border-collapse:collapse; margin-top:16px;
    border-radius:12px; overflow:hidden;
  }
  .results-table th {
    font-size:12px; text-transform:uppercase; color:var(--muted);
    text-align:left; padding:12px;
    background:rgba(167,139,250,.05);
    border-bottom:1px solid var(--line);
  }
  .results-table td {
    padding:12px; border-bottom:1px solid rgba(31,31,53,.6);
    font-size:14px;
  }
  .results-table tr:last-child td { border-bottom:none; }
  .results-table tr:hover td { background:rgba(167,139,250,.04); }
  .empty { text-align:center; color:var(--muted);
           padding:32px 0; font-size:14px; }
  .top1 {
    color:#ffd700; font-weight:800;
    text-shadow:0 0 12px rgba(255,215,0,.5);
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ВХОД -->
  <div id="screen-login" class="card">
    <h1>КОСМОС 4</h1>
    <p class="sub">Викторина по сказкам · 5 вопросов</p>
    <input id="nameInput" placeholder="Твоё имя" maxlength="20">
    <button class="main" onclick="startQuiz()">🎮 Начать викторину</button>
    <button class="admin-btn" onclick="showAdminLogin()">
      👑 Я ВОЖАТЫЙ — проверить
    </button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- ВХОД ВОЖАТОГО -->
  <div id="screen-admin-login" class="card hidden">
    <h1>👑 ВОЖАТЫЙ</h1>
    <p class="sub">Пароль доступа</p>
    <input id="adminPass" type="password" placeholder="Пароль">
    <button class="main" onclick="checkAdminPass()">Войти</button>
    <button class="sec" onclick="showScreen('screen-login')">← Назад</button>
    <div id="adminMsg" class="msg"></div>
  </div>

  <!-- ВОПРОС -->
  <div id="screen-question" class="card hidden">
    <div class="progress" id="progress"></div>
    <img id="qImg" class="q-img" alt="" style="display:none;">
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
    <div id="answerMsg" class="msg"></div>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="screen-result" class="card hidden">
    <h1>РЕЗУЛЬТАТ</h1>
    <div id="resultText" style="text-align:center; font-size:16px;
         color:var(--muted); margin-top:8px;"></div>
    <div class="score" id="resultScore"></div>
    <p class="report-hint">Покажи этот код вожатому:</p>
    <div class="report-code" id="reportCode" onclick="copyCode()"></div>
    <p class="report-hint" style="margin-bottom:16px;">
      (нажми на код, чтобы скопировать)
    </p>
    <button class="sec" onclick="backToLogin()">← К списку</button>
  </div>

  <!-- ПРОВЕРКА ВОЖАТЫМ -->
  <div id="screen-check" class="card hidden">
    <h1>👑 ВОЖАТЫЙ</h1>
    <p class="sub">Вставь коды от участников</p>
    <textarea id="codesInput"
      placeholder="Вставляй коды с новой строки, например:&#10;Аня|АК7Х2|4/5&#10;Боря|БР9М1|3/5"></textarea>
    <button class="main" onclick="checkCodes()">📊 Проверить</button>
    <button class="sec" onclick="clearResults()">🗑 Очистить</button>
    <button class="sec" onclick="showScreen('screen-login')">← Назад</button>
    <div id="checkResults"></div>
  </div>

</div>

<script>
const ADMIN_PASSWORD = "vodadmin";

const SLIDES = [
  { q:"Кто съел Колобка?",
    img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=800",
    options:["Волк","Лиса","Медведь","Заяц"], correct:1 },
  { q:"Кто сломал теремок?",
    img:"https://images.unsplash.com/photo-1518780664697-55e3ad937233?w=800",
    options:["Мышка","Лягушка","Медведь","Лиса"], correct:2 },
  { q:"Что потеряла Золушка на балу?",
    img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=800",
    options:["Кольцо","Туфельку","Платок","Корону"], correct:1 },
  { q:"Кто вытянул репку последним?",
    img:"https://images.unsplash.com/photo-1590779033100-9f60a05a013d?w=800",
    options:["Дед","Бабка","Внучка","Мышка"], correct:3 },
  { q:"Какого цвета была шапочка у Красной Шапочки?",
    img:"https://images.unsplash.com/photo-1596707062890-8f4f2a4e0e5a?w=800",
    options:["Красного","Синего","Зелёного","Жёлтого"], correct:0 }
];

let playerName = "";
let mySlides = [];
let idx = 0;
let score = 0;

function showScreen(id) {
  document.querySelectorAll('.wrap > div')
    .forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('loginMsg').textContent='Введи имя'; return; }
  playerName = name;
  mySlides = shuffle(SLIDES);
  idx = 0; score = 0;
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  if (idx >= mySlides.length) { finish(); return; }
  const s = mySlides[idx];

  const img = document.getElementById('qImg');
  if (s.img) { img.src = s.img; img.style.display='block'; }
  else img.style.display='none';

  document.getElementById('qText').textContent = s.q;
  document.getElementById('answerMsg').textContent = '';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  s.options.forEach((text,i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[i]}</span><span>${text}</span>`;
    b.onclick = () => chooseAnswer(i, b);
    opts.appendChild(b);
  });

  const pr = document.getElementById('progress'); pr.innerHTML='';
  mySlides.forEach((_,i)=>{
    const d=document.createElement('div'); d.className='dot';
    if (i===idx) d.classList.add('active');
    else if (i<idx) d.classList.add('done');
    pr.appendChild(d);
  });
}

function chooseAnswer(choice, btn) {
  const s = mySlides[idx];
  const correct = choice === s.correct;
  document.querySelectorAll('#options .opt').forEach(b=>b.disabled=true);
  if (correct) {
    score++;
    btn.classList.add('correct');
    document.getElementById('answerMsg').textContent = '✅ Правильно!';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('#options .opt')[s.correct]
      .classList.add('correct');
    document.getElementById('answerMsg').textContent = '❌ Неправильно';
  }
  setTimeout(()=>{ idx++; renderQuestion(); }, 1200);
}

function makeCode() {
  const ALPH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let rnd = "";
  for (let i = 0; i < 4; i++)
    rnd += ALPH[Math.floor(Math.random()*ALPH.length)];
  return `${playerName}|${rnd}|${score}/${mySlides.length}`;
}

function finish() {
  showScreen('screen-result');
  document.getElementById('resultText').textContent = `${playerName}, твой результат:`;
  document.getElementById('resultScore').innerHTML =
    `${score}<small> / ${mySlides.length}</small>`;
  const code = makeCode();
  document.getElementById('reportCode').textContent = code;
  document.getElementById('reportCode').dataset.code = code;
}

function copyCode() {
  const el = document.getElementById('reportCode');
  const code = el.dataset.code;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    const old = el.textContent;
    el.textContent = '✅ Скопировано!';
    setTimeout(()=>{ el.textContent = old; }, 1200);
  });
}

function backToLogin() {
  document.getElementById('nameInput').value = playerName;
  showScreen('screen-login');
}

function showAdminLogin() {
  showScreen('screen-admin-login');
  document.getElementById('adminMsg').textContent = '';
  document.getElementById('adminPass').value = '';
}

function checkAdminPass() {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    showScreen('screen-check');
  } else {
    document.getElementById('adminMsg').textContent = '❌ Неверный пароль';
  }
}

function checkCodes() {
  const raw = document.getElementById('codesInput').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line => {
    const parts = line.split('|');
    if (parts.length < 3) return;
    const name = parts[0].trim();
    const code = parts[1].trim();
    const m = parts[2].trim().match(/^(\d+)\s*\/\s*(\d+)$/);
    if (!m) return;
    rows.push({ name, code, sc: parseInt(m[1],10), total: parseInt(m[2],10) });
  });
  const box = document.getElementById('checkResults');
  if (!rows.length) {
    box.innerHTML = '<div class="empty">Нет валидных кодов. Формат: Имя|КОД|4/5</div>';
    return;
  }
  rows.sort((a,b)=> b.sc - a.sc);
  let html = '<table class="results-table"><thead><tr>' +
             '<th>#</th><th>Имя</th><th>Код</th><th>Результат</th>' +
             '</tr></thead><tbody>';
  rows.forEach((r,i) => {
    const cls = i === 0 ? 'top1' : '';
    const medal = i === 0 ? '🥇 ' : (i === 1 ? '🥈 ' : (i === 2 ? '🥉 ' : ''));
    html += `<tr>
      <td>${i+1}</td>
      <td class="${cls}">${medal}${escapeHtml(r.name)}</td>
      <td style="color:var(--muted); font-family:monospace;">${escapeHtml(r.code)}</td>
      <td class="${cls}">${r.sc} / ${r.total}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  const avg = rows.reduce((s,r)=>s+r.sc,0) / rows.length;
  const best = Math.max(...rows.map(r=>r.sc));
  html += `<div class="msg" style="margin-top:16px;">
    Участников: ${rows.length} · Средний балл: ${avg.toFixed(1)} · Лучший: ${best}
  </div>`;
  box.innerHTML = html;
}

function clearResults() {
  document.getElementById('codesInput').value = '';
  document.getElementById('checkResults').innerHTML = '';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
