<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космос 4 · Математика</title>
<style>
  :root {
    --bg-deep:#03060f;
    --bg-mid:#0a1228;
    --card-bg:rgba(15,25,50,.65);
    --card-border:rgba(100,180,255,.15);
    --text:#eaf0ff;
    --muted:#6b7a9e;
    --cyan:#38e0ff;
    --blue:#4f7fff;
    --gold:#ffcc4d;
    --pink:#ff5c9e;
    --ok:#3ddc84;
    --bad:#ff5c5c;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    min-height:100vh;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(79,127,255,.25) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(56,224,255,.2) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, var(--bg-mid) 0%, var(--bg-deep) 75%);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:20px; position:relative; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      radial-gradient(1px 1px at 8% 12%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 22% 8%, #cfe8ff, transparent),
      radial-gradient(1px 1px at 38% 22%, #fff, transparent),
      radial-gradient(2px 2px at 55% 6%, #fff, transparent),
      radial-gradient(1px 1px at 72% 18%, #a8d0ff, transparent),
      radial-gradient(1.5px 1.5px at 88% 10%, #fff, transparent),
      radial-gradient(1px 1px at 12% 45%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 30% 58%, #cfe8ff, transparent),
      radial-gradient(1px 1px at 48% 75%, #fff, transparent),
      radial-gradient(2px 2px at 68% 62%, #fff, transparent),
      radial-gradient(1px 1px at 82% 82%, #a8d0ff, transparent),
      radial-gradient(1.5px 1.5px at 95% 40%, #fff, transparent),
      radial-gradient(1px 1px at 5% 88%, #fff, transparent),
      radial-gradient(1px 1px at 42% 35%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 78% 92%, #cfe8ff, transparent);
    animation:twinkle 6s ease-in-out infinite alternate;
    opacity:.65;
  }
  @keyframes twinkle {
    0% { opacity:.4; }
    50% { opacity:.8; }
    100% { opacity:.5; }
  }
  body::after {
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(ellipse 40% 25% at 20% 30%, rgba(79,127,255,.15), transparent),
      radial-gradient(ellipse 35% 20% at 80% 70%, rgba(255,92,158,.1), transparent);
    filter:blur(40px);
    animation:nebula 20s ease-in-out infinite alternate;
  }
  @keyframes nebula {
    from { transform:scale(1) rotate(0deg); }
    to   { transform:scale(1.15) rotate(5deg); }
  }
  .wrap { width:100%; max-width:680px; position:relative; z-index:1; }
  .card {
    background:var(--card-bg);
    backdrop-filter:blur(20px) saturate(150%);
    -webkit-backdrop-filter:blur(20px) saturate(150%);
    border:1px solid var(--card-border);
    border-radius:28px;
    padding:38px 32px;
    box-shadow:
      0 30px 80px rgba(0,0,0,.7),
      0 0 80px rgba(79,127,255,.08),
      inset 0 1px 0 rgba(255,255,255,.06),
      inset 0 -1px 0 rgba(0,0,0,.3);
    animation:cardIn .6s cubic-bezier(.2,.8,.2,1);
    position:relative;
    overflow:hidden;
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity:.5;
  }
  @keyframes cardIn {
    from { opacity:0; transform:translateY(30px) scale(.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  .emblem {
    width:72px; height:72px; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%,
               rgba(56,224,255,.3), rgba(79,127,255,.15));
    border:1.5px solid rgba(56,224,255,.3);
    box-shadow:
      0 0 30px rgba(56,224,255,.4),
      inset 0 0 20px rgba(79,127,255,.2);
    animation:emblemPulse 3s ease-in-out infinite;
    font-size:32px;
  }
  @keyframes emblemPulse {
    0%,100% {
      box-shadow:0 0 30px rgba(56,224,255,.35),
                 inset 0 0 20px rgba(79,127,255,.15);
    }
    50% {
      box-shadow:0 0 50px rgba(56,224,255,.6),
                 inset 0 0 30px rgba(79,127,255,.3);
    }
  }
  h1 {
    font-size:28px; font-weight:800; letter-spacing:5px;
    text-align:center; margin-bottom:8px;
    background:linear-gradient(135deg, var(--cyan) 0%, var(--blue) 50%, var(--gold) 100%);
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 5s linear infinite;
    text-shadow:0 0 40px rgba(56,224,255,.2);
  }
  @keyframes shine { to { background-position:200% center; } }
  .sub {
    color:var(--muted); font-size:12px; letter-spacing:3px;
    text-transform:uppercase; text-align:center;
    margin-bottom:28px; font-weight:500;
  }
  input, textarea {
    width:100%; padding:15px 18px; font-size:16px;
    border-radius:16px;
    border:1.5px solid rgba(100,180,255,.15);
    background:rgba(3,6,15,.7);
    color:var(--text);
    margin-bottom:14px;
    transition:all .3s cubic-bezier(.2,.8,.2,1);
    font-family:inherit;
    box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
  }
  input:focus, textarea:focus {
    outline:none;
    border-color:var(--cyan);
    background:rgba(3,6,15,.9);
    box-shadow:
      0 0 0 4px rgba(56,224,255,.1),
      0 0 30px rgba(56,224,255,.2),
      inset 0 2px 6px rgba(0,0,0,.3);
    transform:translateY(-1px);
  }
  input::placeholder, textarea::placeholder { color:#4a5878; }
  textarea {
    font-family:monospace; font-size:14px;
    resize:vertical; min-height:100px;
  }
  button {
    width:100%; padding:15px; font-size:15px; font-weight:700;
    border-radius:16px; border:none; cursor:pointer;
    letter-spacing:1px; margin-bottom:10px;
    transition:all .3s cubic-bezier(.2,.8,.2,1);
    font-family:inherit;
    position:relative; overflow:hidden;
  }
  button::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
    transform:translateX(-100%);
    transition:transform .6s;
  }
  button:hover::before { transform:translateX(100%); }
  button.main {
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    color:#03060f;
    box-shadow:
      0 8px 30px rgba(79,127,255,.4),
      inset 0 1px 0 rgba(255,255,255,.3);
    font-weight:800;
  }
  button.main:hover {
    transform:translateY(-2px);
    box-shadow:
      0 12px 40px rgba(79,127,255,.6),
      0 0 60px rgba(56,224,255,.4),
      inset 0 1px 0 rgba(255,255,255,.4);
  }
  button.main:active { transform:translateY(0); }
  button.admin-btn {
    background:linear-gradient(135deg, rgba(255,204,77,.15), rgba(255,92,158,.15));
    border:1.5px solid rgba(255,204,77,.4);
    color:var(--gold);
    box-shadow:
      0 0 24px rgba(255,204,77,.2),
      inset 0 0 20px rgba(255,204,77,.05);
  }
  button.admin-btn:hover {
    background:linear-gradient(135deg, rgba(255,204,77,.25), rgba(255,92,158,.25));
    border-color:var(--gold);
    box-shadow:
      0 0 40px rgba(255,204,77,.4),
      inset 0 0 30px rgba(255,204,77,.1);
    transform:translateY(-1px);
    color:#fff;
  }
  button.sec {
    background:transparent; color:var(--text);
    border:1.5px solid rgba(100,180,255,.2);
  }
  button.sec:hover {
    border-color:var(--cyan);
    background:rgba(56,224,255,.06);
    color:var(--cyan);
  }
  button:disabled {
    opacity:.4; cursor:not-allowed; transform:none !important;
  }
  button:disabled::before { display:none; }
  .msg {
    min-height:22px; margin-top:12px; text-align:center;
    font-size:14px; color:var(--bad); font-weight:500;
  }
  .hidden { display:none !important; }
  .q-img {
    width:100%; max-height:300px; object-fit:cover;
    border-radius:20px; margin-bottom:22px;
    border:1px solid rgba(100,180,255,.2);
    box-shadow:
      0 15px 40px rgba(0,0,0,.6),
      0 0 40px rgba(79,127,255,.15);
    animation:imgIn .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes imgIn {
    from { opacity:0; transform:scale(.95) translateY(10px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }
  .q-text {
    font-size:22px; font-weight:700; text-align:center;
    margin-bottom:24px; line-height:1.4;
    color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.4);
  }
  .options { display:grid; gap:12px; }
  .opt {
    padding:16px 20px; border-radius:16px;
    border:1.5px solid rgba(100,180,255,.15);
    background:rgba(10,18,40,.6);
    color:var(--text); font-size:15px; text-align:left;
    display:flex; align-items:center; gap:16px;
    cursor:pointer; transition:all .25s cubic-bezier(.2,.8,.2,1);
    width:100%; font-weight:500;
    backdrop-filter:blur(8px);
  }
  .opt:hover {
    border-color:var(--cyan);
    background:rgba(56,224,255,.08);
    transform:translateX(4px);
    box-shadow:0 8px 24px rgba(56,224,255,.2);
  }
  .opt .letter {
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg, var(--blue), var(--cyan));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; flex-shrink:0;
    color:#03060f;
    box-shadow:
      0 4px 12px rgba(79,127,255,.4),
      inset 0 1px 0 rgba(255,255,255,.4);
  }
  .opt.correct {
    border-color:var(--ok);
    background:rgba(61,220,132,.12);
    box-shadow:0 0 30px rgba(61,220,132,.25);
  }
  .opt.correct .letter {
    background:linear-gradient(135deg, #1a8a4a, var(--ok));
  }
  .opt.wrong {
    border-color:var(--bad);
    background:rgba(255,92,92,.12);
    box-shadow:0 0 30px rgba(255,92,92,.25);
  }
  .opt.wrong .letter {
    background:linear-gradient(135deg, #a03030, var(--bad));
  }
  .progress {
    display:flex; justify-content:center; gap:8px; margin-bottom:26px;
    flex-wrap:wrap;
  }
  .dot {
    width:10px; height:10px; border-radius:50%;
    background:rgba(100,180,255,.15);
    transition:all .4s cubic-bezier(.2,.8,.2,1);
  }
  .dot.active {
    background:var(--cyan);
    box-shadow:0 0 20px var(--cyan), 0 0 40px rgba(56,224,255,.4);
    transform:scale(1.4);
  }
  .dot.done {
    background:var(--blue);
    box-shadow:0 0 10px rgba(79,127,255,.5);
  }
  .score {
    font-size:72px; font-weight:900; text-align:center;
    margin:20px 0; letter-spacing:3px;
    background:linear-gradient(135deg, var(--cyan), var(--gold), var(--pink));
    background-size:200% auto;
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 4s linear infinite;
    filter:drop-shadow(0 0 30px rgba(56,224,255,.3));
  }
  .score small {
    font-size:26px; color:var(--muted);
    -webkit-text-fill-color:var(--muted);
    font-weight:600;
  }
  .report-code {
    font-family:'Courier New',monospace;
    font-size:24px; font-weight:800;
    text-align:center; letter-spacing:4px; padding:22px;
    background:rgba(3,6,15,.8);
    border:2px dashed rgba(100,180,255,.3);
    border-radius:16px;
    margin:18px 0; word-break:break-all; cursor:pointer;
    transition:all .3s;
    color:var(--cyan);
    text-shadow:0 0 20px rgba(56,224,255,.4);
  }
  .report-code:hover {
    border-color:var(--cyan);
    border-style:solid;
    background:rgba(56,224,255,.08);
    box-shadow:0 0 30px rgba(56,224,255,.3);
    transform:scale(1.02);
  }
  .report-hint {
    text-align:center; color:var(--muted);
    font-size:13px; margin-top:6px;
  }
  .results-table {
    width:100%; border-collapse:separate;
    border-spacing:0; margin-top:20px;
    border-radius:16px; overflow:hidden;
    background:rgba(3,6,15,.4);
    border:1px solid rgba(100,180,255,.1);
  }
  .results-table th {
    font-size:11px; text-transform:uppercase;
    color:var(--muted); letter-spacing:2px;
    text-align:left; padding:14px 12px;
    background:rgba(79,127,255,.08);
    border-bottom:1px solid rgba(100,180,255,.15);
    font-weight:700;
  }
  .results-table td {
    padding:14px 12px;
    border-bottom:1px solid rgba(100,180,255,.06);
    font-size:14px;
  }
  .results-table tr:last-child td { border-bottom:none; }
  .results-table tbody tr { transition:background .2s; }
  .results-table tbody tr:hover td {
    background:rgba(56,224,255,.05);
  }
  .empty {
    text-align:center; color:var(--muted);
    padding:40px 0; font-size:14px;
  }
  .top1 {
    color:var(--gold); font-weight:800;
    text-shadow:0 0 15px rgba(255,204,77,.6);
  }
  .fact {
    margin-top:18px; padding:16px 20px;
    background:rgba(56,224,255,.06);
    border:1px solid rgba(56,224,255,.25);
    border-radius:14px;
    color:var(--text); font-size:14px; line-height:1.6;
    animation:factIn .4s ease-out;
  }
  .fact .fact-icon { margin-right:8px; }
  .fact strong { color:var(--cyan); }
  @keyframes factIn {
    from { opacity:0; transform:translateY(10px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- ВХОД -->
  <div id="screen-login" class="card">
    <div class="emblem">🧮</div>
    <h1>КОСМОС 4</h1>
    <p class="sub">Математика · 10 вопросов</p>
    <input id="nameInput" placeholder="Твоё имя" maxlength="20">
    <button class="main" onclick="startQuiz()">🎮 Начать викторину</button>
    <button class="admin-btn" onclick="showAdminLogin()">
      👑 Я ВОЖАТЫЙ — проверить
    </button>
    <div id="loginMsg" class="msg"></div>
  </div>

  <!-- ВХОД ВОЖАТОГО -->
  <div id="screen-admin-login" class="card hidden">
    <div class="emblem">🔐</div>
    <h1>ВОЖАТЫЙ</h1>
    <p class="sub">Пароль доступа</p>
    <input id="adminPass" type="password" placeholder="Пароль">
    <button class="main" onclick="checkAdminPass()">Войти</button>
    <button class="sec" onclick="showScreen('screen-login')">← Назад</button>
    <div id="adminMsg" class="msg"></div>
  </div>

  <!-- ВОПРОС -->
  <div id="screen-question" class="card hidden">
    <div class="progress" id="progress"></div>
    <img id="qImg" class="q-img" alt="" style="display:none;">
    <div class="q-text" id="qText"></div>
    <div class="options" id="options"></div>
    <div id="answerMsg" class="msg"></div>
    <div id="factBox"></div>
  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="screen-result" class="card hidden">
    <div class="emblem">🏆</div>
    <h1>РЕЗУЛЬТАТ</h1>
    <div id="resultText" style="text-align:center; font-size:16px;
         color:var(--muted); margin-top:8px;"></div>
    <div class="score" id="resultScore"></div>
    <p class="report-hint" style="margin-top:20px;">
      Покажи этот код вожатому:
    </p>
    <div class="report-code" id="reportCode" onclick="copyCode()"></div>
    <p class="report-hint" style="margin-bottom:18px;">
      (нажми на код, чтобы скопировать)
    </p>
    <button class="sec" onclick="backToLogin()">← К списку</button>
  </div>

  <!-- ПРОВЕРКА ВОЖАТЫМ -->
  <div id="screen-check" class="card hidden">
    <div class="emblem">📊</div>
    <h1>РЕЗУЛЬТАТЫ</h1>
    <p class="sub">Вставь коды от участников</p>
    <textarea id="codesInput"
      placeholder="Вставляй коды с новой строки, например:&#10;Аня|АК7Х2|8/10&#10;Боря|БР9М1|6/10"></textarea>
    <button class="main" onclick="checkCodes()">📊 Проверить</button>
    <button class="sec" onclick="clearResults()">🗑 Очистить</button>
    <button class="sec" onclick="showScreen('screen-login')">← Назад</button>
    <div id="checkResults"></div>
  </div>

</div>

<script>
const ADMIN_PASSWORD = "vodadmin";

/* ===== МАТЕМАТИКА В СТИЛЕ ОГЭ/ЕГЭ (1–2 класс) ===== */
const SLIDES = [
  {
    q:"Сколько будет 7 + 5?",
    img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800",
    options:["10","11","12","13"],
    correct:2,
    fact:"📚 7 + 5 = 12. Сначала прибавляем 3 до 10, потом ещё 2."
  },
  {
    q:"Сколько будет 15 − 8?",
    img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800",
    options:["6","7","8","9"],
    correct:1,
    fact:"📚 15 − 8 = 7. Можно отнять 5 до 10, потом ещё 3."
  },
  {
    q:"Сколько будет 4 × 3?",
    img:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800",
    options:["7","10","12","14"],
    correct:2,
    fact:"✖️ 4 × 3 = 12. Это 4 + 4 + 4."
  },
  {
    q:"Сколько сторон у треугольника?",
    img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800",
    options:["2","3","4","5"],
    correct:1,
    fact:"📐 У треугольника 3 стороны и 3 угла."
  },
  {
    q:"Сколько будет 9 + 9?",
    img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800",
    options:["16","17","18","19"],
    correct:2,
    fact:"📚 9 + 9 = 18. Это почти 10 + 10, но на 2 меньше."
  },
  {
    q:"У Пети 10 яблок. Он отдал 3. Сколько осталось?",
    img:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=800",
    options:["6","7","8","9"],
    correct:1,
    fact:"🍎 10 − 3 = 7. Задача на вычитание."
  },
  {
    q:"Сколько будет 20 − 4 − 4?",
    img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800",
    options:["10","11","12","13"],
    correct:2,
    fact:"📚 20 − 4 = 16, потом 16 − 4 = 12."
  },
  {
    q:"Сколько углов у квадрата?",
    img:"https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=800",
    options:["3","4","5","6"],
    correct:1,
    fact:"⬜ У квадрата 4 угла и 4 равные стороны."
  },
  {
    q:"Сколько будет 6 × 2?",
    img:"https://images.unsplash.com/photo-1596495578065-6e0763fa1178?w=800",
    options:["8","10","12","14"],
    correct:2,
    fact:"✖️ 6 × 2 = 12. Это 6 + 6."
  },
  {
    q:"Какое число идёт после 19?",
    img:"https://images.unsplash.com/photo-1509228468518-180dd4864904?w=800",
    options:["18","20","21","22"],
    correct:1,
    fact:"🔢 После 19 идёт 20. Числа идут по порядку."
  }
];

let playerName = "";
let mySlides = [];
let idx = 0;
let score = 0;
let answered = false;

function showScreen(id) {
  document.querySelectorAll('.wrap > div')
    .forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { document.getElementById('loginMsg').textContent='Введи имя'; return; }
  playerName = name;
  mySlides = shuffle(SLIDES);
  idx = 0; score = 0;
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  if (idx >= mySlides.length) { finish(); return; }
  const s = mySlides[idx];
  answered = false;

  const img = document.getElementById('qImg');
  if (s.img) { img.src = s.img; img.style.display='block'; }
  else img.style.display='none';

  document.getElementById('qText').textContent = s.q;
  document.getElementById('answerMsg').textContent = '';
  document.getElementById('factBox').innerHTML = '';

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  s.options.forEach((text,i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="letter">${'ABCD'[i]}</span><span>${text}</span>`;
    b.onclick = () => chooseAnswer(i, b);
    opts.appendChild(b);
  });

  const pr = document.getElementById('progress'); pr.innerHTML='';
  mySlides.forEach((_,i)=>{
    const d=document.createElement('div'); d.className='dot';
    if (i===idx) d.classList.add('active');
    else if (i<idx) d.classList.add('done');
    pr.appendChild(d);
  });
}

function chooseAnswer(choice, btn) {
  if (answered) return;
  answered = true;

  const s = mySlides[idx];
  const correct = choice === s.correct;
  document.querySelectorAll('#options .opt').forEach(b=>b.disabled=true);

  if (correct) {
    score++;
    btn.classList.add('correct');
    document.getElementById('answerMsg').textContent = '✅ Правильно!';
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('#options .opt')[s.correct]
      .classList.add('correct');
    document.getElementById('answerMsg').textContent = '❌ Неправильно';
  }

  if (s.fact) {
    document.getElementById('factBox').innerHTML =
      `<div class="fact"><span class="fact-icon">💡</span>${s.fact}</div>`;
  }

  setTimeout(()=>{ idx++; renderQuestion(); }, 2200);
}

function makeCode() {
  const ALPH = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let rnd = "";
  for (let i = 0; i < 4; i++)
    rnd += ALPH[Math.floor(Math.random()*ALPH.length)];
  return `${playerName}|${rnd}|${score}/${mySlides.length}`;
}

function finish() {
  showScreen('screen-result');
  document.getElementById('resultText').textContent = `${playerName}, твой результат:`;
  document.getElementById('resultScore').innerHTML =
    `${score}<small> / ${mySlides.length}</small>`;
  const code = makeCode();
  document.getElementById('reportCode').textContent = code;
  document.getElementById('reportCode').dataset.code = code;
}

function copyCode() {
  const el = document.getElementById('reportCode');
  const code = el.dataset.code;
  if (!code) return;
  navigator.clipboard.writeText(code).then(() => {
    const old = el.textContent;
    el.textContent = '✅ Скопировано!';
    setTimeout(()=>{ el.textContent = old; }, 1200);
  });
}

function backToLogin() {
  document.getElementById('nameInput').value = playerName;
  showScreen('screen-login');
}

function showAdminLogin() {
  showScreen('screen-admin-login');
  document.getElementById('adminMsg').textContent = '';
  document.getElementById('adminPass').value = '';
}

function checkAdminPass() {
  const pass = document.getElementById('adminPass').value;
  if (pass === ADMIN_PASSWORD) {
    showScreen('screen-check');
  } else {
    document.getElementById('adminMsg').textContent = '❌ Неверный пароль';
  }
}

function checkCodes() {
  const raw = document.getElementById('codesInput').value;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const rows = [];
  lines.forEach(line => {
    const parts = line.split('|');
    if (parts.length < 3) return;
    const name = parts[0].trim();
    const code = parts[1].trim();
    const m = parts[2].trim().match(/^(\d+)\s*\/\s*(\d+)$/);
    if (!m) return;
    rows.push({ name, code, sc: parseInt(m[1],10), total: parseInt(m[2],10) });
  });
  const box = document.getElementById('checkResults');
  if (!rows.length) {
    box.innerHTML = '<div class="empty">Нет валидных кодов. Формат: Имя|КОД|8/10</div>';
    return;
  }
  rows.sort((a,b)=> b.sc - a.sc);
  let html = '<table class="results-table"><thead><tr>' +
             '<th>#</th><th>Имя</th><th>Код</th><th>Результат</th>' +
             '</tr></thead><tbody>';
  rows.forEach((r,i) => {
    const cls = i === 0 ? 'top1' : '';
    const medal = i === 0 ? '🥇 ' : (i === 1 ? '🥈 ' : (i === 2 ? '🥉 ' : ''));
    html += `<tr>
      <td>${i+1}</td>
      <td class="${cls}">${medal}${escapeHtml(r.name)}</td>
      <td style="color:var(--muted); font-family:monospace;">${escapeHtml(r.code)}</td>
      <td class="${cls}">${r.sc} / ${r.total}</td>
    </tr>`;
  });
  html += '</tbody></table>';
  const avg = rows.reduce((s,r)=>s+r.sc,0) / rows.length;
  const best = Math.max(...rows.map(r=>r.sc));
  html += `<div class="msg" style="margin-top:20px; color:var(--cyan);">
    Участников: ${rows.length} · Средний балл: ${avg.toFixed(1)} · Лучший: ${best}
  </div>`;
  box.innerHTML = html;
}

function clearResults() {
  document.getElementById('codesInput').value = '';
  document.getElementById('checkResults').innerHTML = '';
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
